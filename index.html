<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Office Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
        }

        #office-canvas {
            flex: 1;
            background: #f0f0f0;
            position: relative;
            overflow: hidden;
        }

        #sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .agent-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid #ccc;
        }

        .agent-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .agent-card.idle { border-left-color: #95a5a6; }
        .agent-card.working { border-left-color: #3498db; }
        .agent-card.completed { border-left-color: #2ecc71; }
        .agent-card.error { border-left-color: #e74c3c; }

        .agent-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .agent-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .agent-info {
            flex: 1;
        }

        .agent-name {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 2px;
        }

        .agent-role {
            font-size: 11px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .agent-task {
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .agent-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-idle { background: #ecf0f1; color: #7f8c8d; }
        .status-working { background: #d6eaf8; color: #2980b9; }
        .status-completed { background: #d5f4e6; color: #27ae60; }
        .status-error { background: #fadbd8; color: #c0392b; }

        .agent-progress {
            margin-top: 8px;
            height: 4px;
            background: #ecf0f1;
            border-radius: 2px;
            overflow: hidden;
        }

        .agent-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            width: 0%;
            transition: width 0.5s ease;
        }

        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 2px solid #ecf0f1;
        }

        .modal-close {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-close:hover {
            background: #c0392b;
        }

        .log-container {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-line {
            margin-bottom: 4px;
        }

        .log-timestamp {
            color: #95a5a6;
            margin-right: 8px;
        }

        /* Canvas styles */
        canvas {
            display: block;
        }

        .desk {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #34495e;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .desk::after {
            content: '🖥️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="office-canvas">
            <canvas id="canvas"></canvas>
        </div>
        <div id="sidebar">
            <h1>🏢 Agent Office</h1>
            <div id="agent-list"></div>
        </div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="modal-close" onclick="closeModal()">Tutup</button>
            </div>
            <div class="log-container" id="modal-logs"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
